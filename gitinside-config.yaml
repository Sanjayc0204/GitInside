version: 1
profiles:
  default:
    description: "Run Python scraper and collect output files"
    docker:
      template: "python/Dockerfile.chromedriver"
    environment:
      PYTHONPATH: "/app/src"
    pre_run:
      - command: "find"
        args: [".", "-name", ".venv", "-type", "d", "-exec", "rm", "-rf", "{}", "+"]
    execute:
      command: "python"
      args: ["scraper.py"]
      cwd: "src"
    artifacts:
      - path: "/app/src/*/data/*.json"
        target: "/results"
      - path: "*.log"
        target: "/results"